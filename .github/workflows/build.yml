# Builds Nubi on Windows.
# - Every push and pull request to main: build and run tests; the installer is kept as a workflow
#   artifact for 14 days.
# - A pushed tag like v0.1.1: build, sign for the updater, and publish a GitHub release with the
#   installer, its signature and latest.json. Each tag is its own release, so older versions stay
#   downloadable on the Releases page; the updater always reads the newest one.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Build (and release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Nubi ${{ github.ref_name }}
          releaseBody: |
            Windows installer (per-user, no admin). Download `Nubi_*_x64-setup.exe` below.
            Windows SmartScreen may warn because the installer is not code-signed yet: choose More info, then Run anyway.
            Installed copies update themselves. Older versions: see the other releases on this page.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Attach browser extension zip
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path extension/desktime-connect -DestinationPath nubi-desktime-extension.zip
          gh release upload "${{ github.ref_name }}" nubi-desktime-extension.zip --clobber

      - name: Keep installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nubi-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
