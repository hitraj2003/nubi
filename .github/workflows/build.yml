name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Tests
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { throw "NSIS installation failed" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            cargo install tauri-cli --version 2.12.4 --locked
            if ($LASTEXITCODE) { throw "Updater signer installation failed" }
          }

      - name: Build native installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          ./scripts/build-native-installer.ps1 -MakeNsis $compiler

      - name: Sign release candidate
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked --offline | ConvertFrom-Json
          if ($LASTEXITCODE) { throw "Could not read the native package version" }
          $version = ($metadata.packages | Where-Object name -eq 'nubi-app').version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match the native package version" }
          ./scripts/sign-native-candidate.ps1

      - name: Verify signed release candidate
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          NUBI_NATIVE_UPDATE_CANDIDATE: target/native-size/signed-candidate
        run: cargo test --locked --offline -p nubi-app update_transport::tests::signed_native_candidate -- --ignored --exact

      - name: Prepare draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $candidate = 'target/native-size/signed-candidate'
          $artifacts = @(Get-ChildItem -LiteralPath $candidate -File | Select-Object -ExpandProperty FullName)
          gh release create $env:GITHUB_REF_NAME @artifacts --verify-tag --draft --title "Nubi $env:GITHUB_REF_NAME" --notes 'Windows installer for the current user. Installed copies receive updates after this release is published.'
          if ($LASTEXITCODE) { throw "Draft release creation failed" }

      - name: Keep installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nubi-installer
          path: target/native-size/nubi-*-setup.exe
          retention-days: 14
