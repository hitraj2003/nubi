<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nubi DeskTime connect</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e4e4e4; --accent: #1a1a1a; --on-accent: #ffffff; --bad: #b42318; --good: #067647; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --fg: #f2f2f2; --muted: #a0a0a0; --line: #333333; --accent: #f2f2f2; --on-accent: #1a1a1a; --bad: #f97066; --good: #47cd89; } }
    body { margin: 0; width: 280px; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    main { padding: 14px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 14px; font-weight: 600; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 10px 0; border-block: 1px solid var(--line); }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    button { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    button:disabled { opacity: .5; cursor: default; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Nubi DeskTime connect</h1>
    <dl>
      <dt>DeskTime</dt><dd id="desktime">Checking…</dd>
      <dt>Nubi</dt><dd id="nubi">Checking…</dd>
    </dl>
    <p id="note">Nubi uses the DeskTime session in this browser. It never sees your password.</p>
    <div class="actions">
      <button type="button" id="allow" class="primary">Allow access</button>
      <button type="button" id="remove" hidden>Remove access</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
