<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubi notch</title>
<!--
  Styles below are copied from vinzdg/codenotch windows/codenotch/ui/notch.html (MIT, commit 6522e9f):
  pill, fillets, ring cells, hover card and tail, the four edges, and the fold-on-hover motion.
  Not ported: settings orb, move grip, carry, Linux vector outline, adaptive pill.
-->
<style>
  :root{
    --pill:#000; --edge:#2e2e2e; --rest-edge:#5c5c5c; --card:#0a0a0a; --card-line:#242424; --card-rule:#1e1e1e;
    --bar:#2d2d2d; --track:#303030; --hole:#2a2a2a;
    --ample:#00FF88; --watch:#F2FF00; --crit:#FF3F00;
    --ink:#ffffff; --ink-2:#e8e8ea; --ink-3:#c8c8c8; --ink-4:#b0b0b3; --ink-dim:#808080;
    --btn:#252525; --btn-line:#555; --btn-hover:#383838; --btn-line-hover:#aaa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #root{position:relative;width:100%;height:100%}

  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:var(--pill);
    border-radius:20px 0 0 20px;
    border:1px solid var(--edge);border-right:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  #pill::before,#pill::after{content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none}
  #pill{--fillet:38.7px}
  #pill::before{top:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  #pill::after{bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  :root{--ring:44px;--k:calc(44 / 56)}
  .ringwrap{position:relative;width:var(--ring);height:var(--ring);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
  .ringwrap.pressed{transform:scale(.93)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible}
  .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(20px * var(--k));font-weight:700;color:var(--ink-2);letter-spacing:-.5px}
  .glyph svg{display:block;pointer-events:none;width:calc(26px * var(--k));height:calc(26px * var(--k));fill:currentColor}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:var(--ink-2);margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* steps() keeps the always-on-top window from slowing the desktop compositor (codenotch note) */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}.ringwrap{transition:none}}

  #card{
    position:absolute;left:5px;right:108.7px;top:50%;transform:translateY(-50%);
    max-width:246px;margin-left:auto;background:var(--card);border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;
    display:none;
  }
  #card.show{display:block}
  #tail{position:absolute;right:80.5px;width:28.2px;height:32.7px;background:var(--card);display:none;
    clip-path:path('M0 0C0 8.18 16.36 12.43 28.2 16.36C16.36 20.29 0 24.54 0 32.72Z')}
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--ink-dim);margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:var(--ink-2);font-weight:600;white-space:nowrap}
  .w-reset{color:var(--ink-dim);font-size:11px;white-space:nowrap;margin-left:auto}
  .w-track{height:4px;border-radius:2px;background:var(--bar);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:var(--ink-dim)}
  .g-head{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:12px}
  .g-box{border:1px solid var(--card-line);border-radius:10px;padding:8px 10px;margin-top:6px}
  .c-note{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--card-rule);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-4);padding:2px 0;cursor:pointer}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:var(--ink-dim);padding:2px 0}
  .c-auth{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .c-auth button{font:inherit;font-size:11px;color:var(--ink);background:var(--btn);border:1px solid var(--btn-line);border-radius:7px;padding:6px 9px;cursor:pointer}
  .c-auth button:hover{background:var(--btn-hover);border-color:var(--btn-line-hover)}
  .c-auth button.opt.on{background:#1f3d2c;border-color:var(--ample)}
  .other{width:100%;margin-top:6px;font:inherit;font-size:11px;color:var(--ink);background:#000;border:1px solid var(--btn-line);border-radius:7px;padding:5px 8px}
  .cmd{font:11px Consolas,monospace;color:var(--ink-3);background:#000;border-radius:6px;padding:6px;margin-top:6px;max-height:90px;overflow:auto;white-space:pre-wrap;word-break:break-all}

  /* Waiting approvals and questions: pop out beside the pill on their own, stacked or side by side */
  #reqs{position:absolute;display:none;gap:10px;max-height:calc(100% - 16px);overflow:auto;scrollbar-width:thin}
  #reqs.show{display:flex}
  #reqs.stack{flex-direction:column}
  #reqs.side{flex-direction:row;align-items:flex-start}
  #reqs .req{width:246px;flex:none;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--card-line);
    animation:req-in .36s cubic-bezier(.32,.72,.24,1) both}
  #reqs .req .g-head{margin-top:0}
  @keyframes req-in{from{opacity:0;transform:translateX(12px) scale(.96)}to{opacity:1;transform:none}}
  body[data-edge="left"] #reqs .req{animation-name:req-in-l}
  @keyframes req-in-l{from{opacity:0;transform:translateX(-12px) scale(.96)}to{opacity:1;transform:none}}
  body.dragging #pill{cursor:grabbing}
  @media (prefers-reduced-motion: reduce){#reqs .req{animation:none}}

  /* Other three edges: mirrored or rotated from the right-hand layout */
  body[data-edge="left"] #pill{right:auto;left:0;border-radius:0 20px 20px 0;border-right:1px solid var(--edge);border-left:none}
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{right:auto;left:0}
  body[data-edge="left"] #pill::before{background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #pill::after{background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #card{left:108.7px;right:5px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{right:auto;left:80.5px;clip-path:path('M28.2 0C28.2 8.18 11.84 12.43 0 16.36C11.84 20.29 28.2 24.54 28.2 32.72Z')}
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:12px 18px;border-right:1px solid var(--edge)}
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{right:auto;top:auto;bottom:auto}
  body[data-edge="top"] #pill{top:0;border-radius:0 0 20px 20px;border-top:none}
  body[data-edge="top"] #pill::before{top:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="top"] #pill::after{top:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill{bottom:0;border-radius:20px 20px 0 0;border-bottom:none}
  body[data-edge="bottom"] #pill::before{bottom:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill::after{bottom:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{left:8px;right:auto;top:0;transform:none;margin-left:0;width:246px;max-height:calc(100% - 150px)}
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:32.7px;height:28.2px}
  body[data-edge="top"] #tail{clip-path:path('M0 28.2C8.18 28.2 12.43 11.84 16.36 0C20.29 11.84 24.54 28.2 32.72 28.2Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C8.18 0 12.43 16.36 16.36 28.2C20.29 16.36 24.54 0 32.72 0Z')}

  /* Fold on hover: the open pill is clipped down to a 10 x 79 tab; #rest draws its outline */
  #pill{--clip-open:inset(-40px -1px -40px -1px round 0);
    --clip-rest:inset(calc(50% - 39.5px) 0 calc(50% - 39.5px) calc(100% - 10px) round 6px 0 0 6px);
    clip-path:var(--clip-open);transition:clip-path .36s cubic-bezier(.32,.72,.24,1)}
  body.folded #pill{clip-path:var(--clip-rest)}
  body[data-edge="left"] #pill{--clip-rest:inset(calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) 0 round 0 6px 6px 0)}
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{--clip-open:inset(-1px -40px -1px -40px round 0)}
  body[data-edge="top"] #pill{--clip-rest:inset(0 calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) round 0 0 6px 6px)}
  body[data-edge="bottom"] #pill{--clip-rest:inset(calc(100% - 10px) calc(50% - 39.5px) 0 calc(50% - 39.5px) round 6px 6px 0 0)}
  #rest{position:absolute;box-sizing:border-box;background:var(--pill);border:1px solid var(--rest-edge);pointer-events:none;
    right:0;top:50%;translate:0 -50%;width:10px;height:79px;border-right:none;border-radius:6px 0 0 6px;
    opacity:0;transition:opacity .16s ease}
  body.folded #rest{opacity:1;transition:opacity .2s ease .18s}
  body[data-edge="left"] #rest{right:auto;left:0;border-right:1px solid var(--rest-edge);border-left:none;border-radius:0 6px 6px 0}
  body[data-edge="top"] #rest,body[data-edge="bottom"] #rest{right:auto;left:50%;top:auto;translate:-50% 0;width:79px;height:10px;border:1px solid var(--rest-edge)}
  body[data-edge="top"] #rest{top:0;border-top:none;border-radius:0 0 6px 6px}
  body[data-edge="bottom"] #rest{bottom:0;border-bottom:none;border-radius:6px 6px 0 0}
  /* Rings leave one after another, sliding 10 px toward the edge (codenotch stagger) */
  .cell{transition:opacity .18s ease calc(var(--i,0) * 28ms),translate .3s cubic-bezier(.32,.72,.24,1) calc(var(--i,0) * 28ms)}
  body.folded .cell{opacity:0;translate:10px 0}
  body.folded[data-edge="left"] .cell{translate:-10px 0}
  body.folded[data-edge="top"] .cell{translate:0 -10px}
  body.folded[data-edge="bottom"] .cell{translate:0 10px}
  @media (prefers-reduced-motion: reduce){#pill,#rest,body.folded #rest,.cell{transition:none}}
</style>
</head>
<body data-edge="right">
<div id="root">
  <div id="reqs"></div>
  <div id="card"></div>
  <div id="tail"></div>
  <div id="pill"></div>
  <div id="rest"></div>
</div>
<script src="notch.js"></script>
</body>
</html>
