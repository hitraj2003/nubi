<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claude-overlay alert</title>
<!--
  Pill look, motion and sounds from Terryxxx/Navi src/renderer (Apache-2.0, commit e8e0c40).
  Changes: clickable (opens the panel), provider label, question/permission actions.
-->
<style>
  :root{
    --color-success:#4CD964; --color-warning:#FFD60A; --color-info:#0A84FF;
    --glow-success:rgba(76,217,100,.5); --glow-warning:rgba(255,214,10,.5); --glow-info:rgba(10,132,255,.5);
  }
  html,body{margin:0;padding:0;overflow:hidden;background:transparent !important;height:100vh;
    display:flex;justify-content:center;align-items:flex-start;
    font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none}
  .island{background:#000;border-radius:28px;margin-top:12px;cursor:pointer;
    transition:transform .5s cubic-bezier(.16,1,.3,1),width .5s cubic-bezier(.16,1,.3,1),height .5s cubic-bezier(.16,1,.3,1),
      opacity .5s cubic-bezier(.16,1,.3,1),padding .5s cubic-bezier(.16,1,.3,1),box-shadow .5s cubic-bezier(.16,1,.3,1);
    display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;
    will-change:transform,opacity,width,height}
  .island.collapsed{width:120px;height:32px;opacity:0;transform:scale(.8);box-shadow:none}
  .island.expanded{width:auto;min-width:300px;max-width:480px;height:56px;opacity:1;transform:scale(1);padding:0 20px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.5),0 8px 20px -4px rgba(0,0,0,.4),0 2px 8px -2px rgba(0,0,0,.6)}
  .island-content{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;opacity:0;
    transition:opacity .5s cubic-bezier(.19,1,.22,1)}
  .island.expanded .island-content{opacity:1;transition:opacity .5s cubic-bezier(.16,1,.3,1);transition-delay:.1s}
  .icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .icon svg{width:20px;height:20px}
  .text-group{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .title{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;line-height:1.2}
  .message{color:rgba(255,255,255,.6);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;line-height:1.2}
  .project{color:rgba(255,255,255,.35);font-size:10px;font-weight:500;white-space:nowrap;flex-shrink:0;margin-left:auto}
  .island.type-success .icon{color:var(--color-success);filter:drop-shadow(0 0 8px var(--glow-success))}
  .island.type-warning .icon{color:var(--color-warning);filter:drop-shadow(0 0 8px var(--glow-warning))}
  .island.type-info .icon{color:var(--color-info);filter:drop-shadow(0 0 8px var(--glow-info))}
  @keyframes icon-pop{0%{transform:scale(.4) rotate(-15deg);opacity:0}50%{transform:scale(1.25) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes icon-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.9}}
  .island.expanded .icon svg{animation:icon-pop .6s cubic-bezier(.175,.885,.32,1.275) .1s both}
  .island.expanded.type-info .icon svg,.island.expanded.type-warning .icon svg{
    animation:icon-pop .6s cubic-bezier(.175,.885,.32,1.275) .1s both,icon-pulse 2s ease-in-out .7s infinite}
  @media (prefers-reduced-motion: reduce){.island,.island-content{transition:none}.icon svg{animation:none !important}}
</style>
</head>
<body>
  <div id="island" class="island collapsed">
    <div class="island-content">
      <div class="icon" id="icon"></div>
      <div class="text-group"><div class="title" id="title"></div><div class="message" id="message"></div></div>
      <div class="project" id="project"></div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
