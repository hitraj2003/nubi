<!doctype html>
<html lang="en" data-surface="notch">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<title>Nubi</title>
<!--
  Island look, motion, icons and sounds from Terryxxx/Navi src/renderer (Apache-2.0, commit e8e0c40).
  Request cards (approvals, Claude questions) are ours, drawn in the same material and motion.
-->
<style>
  :root{
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html,body{margin:0;padding:0;overflow:hidden;background:transparent !important;height:100vh;
    font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none;color:var(--ink)}
  #stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px}

  /* ---- Alert island (Navi) ---- */
  /* Size, scale and opacity are driven by springs in overlay.js (ui/motion.js); no CSS transitions. */
  .island{background:var(--notch-bg);border-radius:28px;cursor:pointer;padding:0 14px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;will-change:transform,opacity,width,height;
    width:120px;height:0;opacity:0;transform:scale(.8);margin-bottom:-8px}
  .island.expanded{box-shadow:var(--shadow)}
  .island-content{display:flex;align-items:center;gap:12px;width:100%;opacity:0}
  .icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .icon svg{width:20px;height:20px}
  .text-group{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;line-height:1.2}
  .message{color:var(--ink-2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .type-success .icon{color:var(--success);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--success) 50%,transparent))}
  .type-warning .icon{color:var(--warning);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--warning) 50%,transparent))}
  .type-info .icon{color:var(--info);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--info) 50%,transparent))}
  @keyframes icon-pop{0%{transform:scale(.4) rotate(-15deg);opacity:0}50%{transform:scale(1.25) rotate(5deg);opacity:1}100%{transform:none;opacity:1}}
  .island.expanded .icon svg,.card.in .icon svg{animation:icon-pop .6s cubic-bezier(.175,.885,.32,1.275) .1s both}

  /* ---- Request cards: same black material and motion as the island ---- */
  #deck{position:relative}
  .card{width:340px;box-sizing:border-box;background:var(--notch-bg);border-radius:24px;padding:16px;box-shadow:var(--shadow);
    transform-origin:50% 0;opacity:0;will-change:transform,opacity}
  .card.leave{pointer-events:none}
  .card .body{transition:opacity .3s var(--ease)}
  /* Stacked: a deck. The front card is whole; cards behind it peek out just above. */
  #deck.stack .card{position:absolute;left:0;top:0}
  #deck.stack .card.back{pointer-events:none}
  #deck.stack .card.back .body{opacity:0}
  /* List: side by side */
  #deck.list{display:flex;gap:12px;align-items:flex-start}

  .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .head .t{font-size:13px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head .m{font-size:11px;color:var(--ink-3);white-space:nowrap}
  .q{font-size:13px;line-height:1.4;margin-bottom:10px}
  .q .h{color:var(--ink-3);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:4px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:var(--ink);
    background:var(--row);border:1px solid transparent;border-radius:12px;padding:8px 12px;cursor:pointer;transition:background-color .15s,border-color .15s}
  .opt:hover{background:var(--row-hover)}
  .opt.on{border-color:var(--info);background:var(--acc-soft)}
  .opt .n{width:16px;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
  .opt .l{display:flex;flex-direction:column;gap:1px;min-width:0}
  .opt .l b{font-weight:500;font-size:13px}
  .opt .l small{color:var(--ink-2);font-size:11px}
  .other{width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-size:13px;color:var(--ink);background:var(--row);
    border:1px solid transparent;border-radius:12px;padding:8px 12px;outline:none}
  .other:focus{border-color:var(--notch-ink-24)}
  .cmd{font:12px "Cascadia Mono",Consolas,monospace;color:var(--notch-ink-80);background:var(--notch-ink-6);border-radius:12px;
    padding:8px 12px;max-height:96px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-bottom:12px}
  .acts{display:flex;align-items:center;gap:8px;margin-top:12px}
  .btn{font:inherit;font-size:12px;font-weight:500;border:none;border-radius:999px;padding:7px 14px;cursor:pointer;transition:background-color .15s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--notch-action);color:var(--notch-action-ink)}
  .btn.primary:hover{background:var(--notch-action-hover)}
  .btn.quiet{background:var(--notch-ink-12);color:var(--ink)}
  .btn.quiet:hover{background:var(--notch-ink-18)}
  .link{font:inherit;font-size:12px;color:var(--ink-2);background:none;border:none;padding:4px;cursor:pointer}
  .link:hover{color:var(--ink)}
  .grow{flex:1}
  .count{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  /* Provider colours */
  .card.p-claude{--pc:var(--claude);--pc-soft:var(--pc-claude-soft)}
  .card.p-codex{--pc:var(--codex);--pc-soft:var(--pc-codex-soft)}
  .card .head .icon{color:var(--pc) !important;filter:none !important}
  .card .opt.on{border-color:var(--pc);background:var(--pc-soft)}
  .card .other:focus{border-color:var(--pc)}
  .card .timebar i{background:var(--pc)}
  .slim .sdot{background:var(--pc) !important}
  .slim .pm{color:var(--pc)}
  /* Time bar: the card's bottom edge counts down to the terminal takeover */
  .card{position:relative;overflow:hidden}
  #deck.stack .card{position:absolute}
  .timebar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--notch-ink-6)}
  .timebar i{display:block;height:100%;background:var(--notch-ink-55);transform-origin:left center}
  .card.slim .timebar{left:18px;right:18px;bottom:0;border-radius:2px}
  /* Slim approval pill */
  .card.slim{width:auto;max-width:600px;display:flex;align-items:center;gap:12px;height:48px;padding:0 10px 0 18px;border-radius:24px}
  .slim .sdot{width:8px;height:8px;border-radius:4px;background:var(--warn);flex:none}
  .slim .st{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;margin-right:8px}
  .sbtn{font:inherit;font-size:12px;font-weight:600;border:none;border-radius:999px;padding:6px 18px;cursor:pointer;flex:none;transition:filter .15s,transform .1s}
  .sbtn:hover{filter:brightness(1.08)} .sbtn:active{transform:scale(.97)}
  .sbtn.ok{background:var(--notch-approve);color:var(--notch-approve-ink)}
  .sbtn.no{background:var(--notch-no);color:var(--notch-no-ink)}
  .slim .pm{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
  .slim .pm svg{width:18px;height:18px;fill:currentColor}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
  .sw{color:var(--notch-ink-45);font-size:12px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;flex:none}
</style>
</head>
<body>
  <div id="stage">
    <div id="island" class="island collapsed">
      <div class="island-content">
        <div class="icon" id="icon"></div>
        <div class="text-group"><div class="title" id="title"></div><div class="message" id="message"></div></div>
      </div>
    </div>
    <div id="deck" class="stack"></div>
  </div>
  <script src="motion.js"></script>
  <script src="sounds.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
