<!doctype html>
<html lang="en" data-surface="notch">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<title>island</title>
<link rel="stylesheet" href="island.css">
</head>
<body data-edge="top">
  <div id="shape" class="closed">
    <svg id="bg"><path id="bgp"/></svg>
    <div id="views">
      <!-- Folded: a thin tab until hovered. -->
      <div class="v" id="v-tab"></div>
      <!-- Closed: the small pill. -->
      <div class="v" id="v-compact">
        <span class="c-left" id="c-left"></span>
        <span class="c-right" id="c-right"></span>
      </div>
      <!-- An alert, shown for a few seconds. -->
      <div class="v" id="v-alert">
        <span class="a-icon" id="a-icon"></span>
        <span class="a-text"><b id="a-title"></b><span id="a-body"></span></span>
      </div>
      <!-- Open: tabs and their content. -->
      <div class="v" id="v-open">
        <div class="bar">
          <div class="tabs" id="tabs" role="tablist">
            <i class="tab-hl" id="tab-hl"></i>
            <button type="button" data-tab="requests" role="tab">Waiting<span class="tn" id="tn-requests"></span></button>
            <button type="button" data-tab="sessions" role="tab">Sessions<span class="tn" id="tn-sessions"></span></button>
            <button type="button" data-tab="usage" role="tab">Usage</button>
            <button type="button" data-tab="desktime" role="tab" id="tab-desktime" hidden>DeskTime</button>
          </div>
          <span class="grow"></span>
          <button type="button" class="ib" id="refresh-usage" title="Refresh usage now" aria-label="Refresh usage now">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></button>
          <button type="button" class="ib" id="dnd" title="Do not disturb">
            <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
          <button type="button" class="ib" id="open-panel" title="Open Nubi window" aria-label="Open Nubi window">
            <!-- Window glyph, not a gear: the button opens the panel on Inbox, not Settings. -->
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20M6 4v5"/></svg></button>
        </div>
        <div class="pane" id="pane"></div>
      </div>
    </div>
  </div>
  <script src="usage-color.js"></script>
  <script src="motion.js"></script>
  <script src="sounds.js"></script>
  <script src="usage-status.js"></script>
  <script src="island.js"></script>
</body>
</html>
