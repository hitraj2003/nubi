<!doctype html>
<html lang="en" data-surface="notch">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<title>Nubi launcher</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none;
    font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #card{position:absolute;top:4px;left:4px;right:4px;border-radius:16px;padding:12px;box-sizing:border-box;background:var(--notch-bg);box-shadow:var(--notch-tip-shadow);opacity:0}
  .title{font-size:14px;font-weight:500;line-height:1.2}
  .dir{font-size:11px;color:var(--ink-3);margin:2px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
  .opts{display:flex;gap:8px}
  .opt{flex:1;border:0;border-radius:10px;padding:12px;background:var(--row);color:var(--ink-2);font:inherit;text-align:left;cursor:pointer}
  .opt{transition:background-color .16s,color .16s}
  .opt:hover{color:var(--ink)}
  .opt.on{color:var(--notch-active-label);box-shadow:inset 0 0 0 1.5px var(--notch-active-label)}
  @media (prefers-reduced-motion: reduce){.opt{transition:none}}
  [data-motion="reduce"] .opt{transition:none}
  .opt{display:flex;align-items:center;justify-content:space-between}
  .opt kbd{min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;
    background:var(--row);font:500 11px/17px var(--num);font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:center}
  .err{color:var(--bad);font-size:12px;margin-top:8px}
  .foot{margin-top:12px;font-size:11px;color:var(--ink-2)}
</style>
</head>
<body>
  <div id="card">
    <div class="title">Open in terminal</div>
    <div class="dir" id="dir"></div>
    <div class="opts" id="opts">
      <button class="opt" data-cli="claude">Claude<kbd>C</kbd></button>
      <button class="opt" data-cli="codex">Codex<kbd>X</kbd></button>
    </div>
    <div class="err" id="err"></div>
    <div class="foot" id="foot">Arrows to choose, Enter to open, Esc to close</div>
  </div>
  <script src="motion.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
