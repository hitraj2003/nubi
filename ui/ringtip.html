<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claude-overlay ring tooltip</title>
<!-- Layout recreated from yonathanamir/claude-usage-meter tooltip_widget.py (MIT, commit 260e4f2). -->
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none;font-family:"Segoe UI",system-ui,sans-serif}
  #tip{position:absolute;inset:4px;border-radius:10px;padding:10px 10px 8px;box-sizing:border-box;
    background:rgba(26,23,20,.94);border:1px solid rgba(255,255,255,.235);color:#fff}
  .title{font-size:14.7px;font-weight:700;line-height:1.2}
  .tier{font-size:10.7px;color:#888;margin-top:2px}
  .div{height:1px;background:rgba(255,255,255,.12);margin:8px 0 6px}
  .row{position:relative;border-radius:4px;padding:4px 4px 2px;margin:0 -4px 2px}
  .row.on{background:rgba(217,119,60,.1)}
  .rh{display:flex;justify-content:space-between;font-size:12px;color:#ccc}
  .row.on .rh .l{font-weight:700;color:#fff}
  .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin:5px 0 3px;overflow:hidden}
  .fill{height:100%;border-radius:3px}
  .reset{font-size:9.3px;color:#666}
  .warn{margin-top:6px;border-radius:4px;background:rgba(80,30,30,.63);border:1px solid rgba(200,60,60,.39);
    color:rgb(230,120,100);font-size:10.7px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{position:absolute;bottom:6px;left:10px;font-size:9.3px;color:#555}
  .loading{color:#aaa;font-size:13px;text-align:center;margin-top:20px}
</style>
</head>
<body>
  <div id="tip"></div>
  <script src="ringtip.js"></script>
</body>
</html>
