<!doctype html>
<html lang="en" data-surface="notch">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<title>Nubi</title>
<!-- Layout after yonathanamir/claude-usage-meter tooltip_widget.py (MIT, commit 260e4f2); material and colours from the notch (island.css). -->
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none;
    font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #tip{position:absolute;inset:4px;border-radius:16px;padding:12px;box-sizing:border-box;background:var(--notch-bg);
    box-shadow:var(--notch-tip-shadow);opacity:0}
  .title{font-size:14px;font-weight:500;line-height:1.2}
  .tier{font-size:11px;color:var(--ink-3);margin-top:2px}
  .div{height:1px;background:var(--line);margin:8px 0}
  .row{position:relative;border-radius:8px;padding:4px 8px;margin:0 -8px 4px}
  .row.on{background:var(--row)}
  .rh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
  .row.on .rh .l{color:var(--notch-active-label);font-weight:500}
  .rh .v{font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  .bar{height:4px;border-radius:2px;background:var(--notch-ink-12);margin:4px 0;overflow:hidden}
  .fill{height:100%;border-radius:2px;transform-origin:left center}
  .reset{font-size:10px;color:var(--ink-3)}
  .warn{margin-top:6px;border-radius:10px;background:var(--row);color:var(--bad);font-size:11px;padding:4px 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .waiting{color:var(--warn);font-size:12px;margin-top:6px}
  .foot{position:absolute;bottom:8px;left:12px;font-size:10px;color:var(--ink-3)}
  .loading{color:var(--ink-2);font-size:13px;text-align:center;margin-top:20px}
</style>
</head>
<body>
  <div id="tip"></div>
  <script src="motion.js"></script>
  <script src="usage-color.js"></script>
  <script src="usage-status.js"></script>
  <script src="ringtip.js"></script>
</body>
</html>
