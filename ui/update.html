<!doctype html>
<html lang="en" data-surface="notch">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nubi update</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="update.css">
  <script src="theme.js"></script>
</head>
<body>
  <section id="notice" aria-labelledby="title" hidden>
    <header><img src="glyphs/nubi-logo.png" alt="" width="28" height="28"><div><h1 id="title">Nubi update available</h1><p id="version"></p></div></header>
    <h2>What's new</h2>
    <div id="notes" tabindex="0" aria-label="Release notes"></div>
    <button id="release-notes" type="button" class="link">Read full release notes</button>
    <p id="message" role="status" aria-live="polite"></p>
    <footer><span id="countdown"></span><button id="cancel" type="button">Cancel</button><button id="install" type="button" class="primary">Update</button></footer>
  </section>
  <script src="update.js"></script>
</body>
</html>
