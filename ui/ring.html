<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubi</title>
<!-- Drawn in the notch material (island.css). Drag and snap from yonathanamir/claude-usage-meter (MIT, commit 260e4f2). -->
<style>
  :root{--warn:#FFB340}
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none;cursor:default}
  svg{display:block}
  text{fill:#fff}
  text.n{font:600 15px "Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  text.s{font:9px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;fill:rgba(255,255,255,.38)}
  text.n.h{font-size:12px}
  .stale{opacity:.5}
  .run{animation:run 1.1s linear infinite}
  @keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .spin{transform-origin:42px 42px;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.spin,.pulse,.run{animation:none}}
</style>
</head>
<body>
  <svg id="ring" width="84" height="84"></svg>
  <script src="motion.js"></script>
  <script src="usage-color.js"></script>
  <script src="ring.js"></script>
</body>
</html>
