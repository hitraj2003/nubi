[package]
name = "notch-slint"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Standalone Nubi notch toolkit spike; static data only"
build = "build.rs"

[[bin]]
name = "toolkit-gate"
path = "src/bin/toolkit-gate.rs"
required-features = ["software"]

[[bin]]
name = "parity"
path = "src/bin/parity.rs"
required-features = ["software"]

[features]
default = ["software"]
femtovg = ["slint/renderer-femtovg"]
software = ["slint/renderer-software"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "unstable-winit-030", "raw-window-handle-06", "accessibility"] }
raw-window-handle = "=0.6.2"

[build-dependencies]
slint-build = "=1.18.1"

# Match the application's existing release profile. No size-specific tuning.
[profile.release]
lto = true
codegen-units = 1
strip = true
