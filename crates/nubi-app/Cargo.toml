[package]
name = "nubi-app"
version = "0.1.4"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "nubi"
path = "src/main.rs"

[dependencies]
nubi-core = { path = "../nubi-core" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "unstable-winit-030", "raw-window-handle-06", "accessibility"] }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
semver = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
minisign-verify = "0.3"
tray-icon = { version = "0.25", default-features = false }
global-hotkey = "0.8"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_Media_Audio"] }
windows-link = "0.2"

[build-dependencies]
slint-build = "=1.18.1"

[features]
# Dev only: with SLINT_LIVE_PREVIEW=1 at build time, the running app reloads .slint edits on save.
live-preview = ["slint/live-preview"]
